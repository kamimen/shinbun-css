name: Release

# Runs when a v* tag is pushed, including the tag that GitHub creates when you publish a release in the web UI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest
      - name: tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm run build
      - name: dist must be committed
        run: git diff --exit-code -- dist
      - name: publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is already on npm; skipping publish"
          else
            npm publish --provenance --access public --ignore-scripts
          fi
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
